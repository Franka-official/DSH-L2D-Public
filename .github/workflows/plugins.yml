name: Portable plugin checks

on:
  push:
    paths:
      - 'integrations/**'
      - 'tools/check_plugins.py'
      - 'requirements-plugins-dev.txt'
      - '.github/workflows/plugins.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - 'tools/check_plugins.py'
      - 'requirements-plugins-dev.txt'
      - '.github/workflows/plugins.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-plugin-tests:
    name: Plugin syntax and offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install declared development test dependency
        run: python -m pip install -r requirements-plugins-dev.txt
      - name: Run actual plugin checks
        run: python tools/check_plugins.py
